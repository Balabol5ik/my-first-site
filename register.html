<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">
                🚀
            </div>

            <h1 class="title">
                Создать аккаунт
            </h1>

            <p class="subtitle">
                Зарегистрируйся на нашем сайте
            </p>

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                type="password"
                id="password"
                placeholder="Пароль"
            >

            <button
                class="button"
                id="registerButton"
            >
                Зарегистрироваться
            </button>

            <p id="message"></p>

            <div class="footer">
                Уже есть аккаунт?
                <a href="login.html">Войти</a>
            </div>

        </div>

    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
